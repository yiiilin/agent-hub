name: agent-hub-dev

x-development-labels: &development-labels
  com.agent-hub.environment: development

services:
  postgres:
    image: postgres:16
    labels: *development-labels
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_hub}
      POSTGRES_DB: ${POSTGRES_DB:-agent_hub}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    labels: *development-labels
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://agent_hub:agent_hub@postgres:5432/agent_hub}
      BIND_ADDR: ${BIND_ADDR:-0.0.0.0:8080}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      EMBED_JWT_SECRET: ${EMBED_JWT_SECRET:-dev-embed-jwt-secret}
      EMBED_JWT_ISSUER: ${EMBED_JWT_ISSUER:-agent-hub-dev}
      EMBED_JWT_AUDIENCE: ${EMBED_JWT_AUDIENCE:-agent-hub-widget}
      OIDC_MOCK_ENABLED: ${OIDC_MOCK_ENABLED:-true}
      SEED_DEV_USER: ${SEED_DEV_USER:-true}
      HUB_MODEL_SECRET_KEY: ${HUB_MODEL_SECRET_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      SEED_DEV_MODEL_CONNECTION: ${SEED_DEV_MODEL_CONNECTION:-true}
      DEV_MODEL_PROVIDER_BASE_URL: ${DEV_MODEL_PROVIDER_BASE_URL:-http://fake-model-provider:8080}
      DEV_MODEL_PROVIDER_MODEL_ID: ${DEV_MODEL_PROVIDER_MODEL_ID:-hub-proxy-smoke}
      DEV_MODEL_PROVIDER_API_KEY: ${DEV_MODEL_PROVIDER_API_KEY:-dev-model-provider-api-key}
      DEV_RUNTIME_ENROLLMENT_TOKEN: ${DEV_RUNTIME_ENROLLMENT_TOKEN:-dev-runtime-enrollment-token}
      HUB_MODEL_PROXY_TIMEOUT_SECS: ${HUB_MODEL_PROXY_TIMEOUT_SECS:-300}
      HUB_SESSION_BUNDLE_MAX_BYTES: ${HUB_SESSION_BUNDLE_MAX_BYTES:-10737418240}
      HUB_BUNDLE_S3_ENDPOINT: ${HUB_BUNDLE_S3_ENDPOINT:-http://bundle-store:9000}
      HUB_BUNDLE_S3_BUCKET: ${HUB_BUNDLE_S3_BUCKET:-agent-hub-sessions}
      HUB_BUNDLE_S3_REGION: ${HUB_BUNDLE_S3_REGION:-us-east-1}
      HUB_BUNDLE_S3_ACCESS_KEY_ID: ${HUB_BUNDLE_S3_ACCESS_KEY_ID:-agent-hub-dev}
      HUB_BUNDLE_S3_SECRET_ACCESS_KEY: ${HUB_BUNDLE_S3_SECRET_ACCESS_KEY:-agent-hub-dev-secret}
      HUB_BUNDLE_S3_SESSION_TOKEN: ${HUB_BUNDLE_S3_SESSION_TOKEN:-}
      HUB_BUNDLE_S3_SERVER_SIDE_ENCRYPTION: ${HUB_BUNDLE_S3_SERVER_SIDE_ENCRYPTION:-}
      HUB_BUNDLE_S3_KMS_KEY_ID: ${HUB_BUNDLE_S3_KMS_KEY_ID:-}
      HUB_BUNDLE_S3_ALLOW_HTTP: ${HUB_BUNDLE_S3_ALLOW_HTTP:-true}
      HUB_CODEX_GITHUB_API_BASE: ${HUB_CODEX_GITHUB_API_BASE:-https://api.github.com/repos/openai/codex}
      HUB_CODEX_GITHUB_ALLOW_HTTP: ${HUB_CODEX_GITHUB_ALLOW_HTTP:-false}
      HUB_CODEX_ARTIFACT_ROOT: ${HUB_CODEX_ARTIFACT_ROOT:-/var/lib/agent-hub/codex-artifacts}
      RUST_LOG: ${BACKEND_RUST_LOG:-agent_hub_backend=info,tower_http=info}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      bundle-store-init:
        condition: service_completed_successfully
    volumes:
      - hub-data:/var/lib/agent-hub

  bundle-store:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    labels: *development-labels
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${HUB_BUNDLE_S3_ACCESS_KEY_ID:-agent-hub-dev}
      MINIO_ROOT_PASSWORD: ${HUB_BUNDLE_S3_SECRET_ACCESS_KEY:-agent-hub-dev-secret}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - bundle-store-data:/data

  bundle-store-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    labels: *development-labels
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://bundle-store:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${HUB_BUNDLE_S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${HUB_BUNDLE_S3_ACCESS_KEY_ID:-agent-hub-dev}
      MINIO_ROOT_PASSWORD: ${HUB_BUNDLE_S3_SECRET_ACCESS_KEY:-agent-hub-dev-secret}
      HUB_BUNDLE_S3_BUCKET: ${HUB_BUNDLE_S3_BUCKET:-agent-hub-sessions}
    depends_on:
      bundle-store:
        condition: service_healthy

  runtime-init:
    labels: *development-labels
    build:
      context: .
      dockerfile: deploy/runtime.Dockerfile
    user: "0:0"
    command: ["chown", "-R", "10001:10001", "/var/lib/agent-hub-runtime"]
    volumes:
      - runtime-data:/var/lib/agent-hub-runtime

  runtime:
    labels: *development-labels
    build:
      context: .
      dockerfile: deploy/runtime.Dockerfile
    environment:
      HUB_URL: ${HUB_URL:-http://backend:8080}
      RUNTIME_ENROLLMENT_TOKEN: ${DEV_RUNTIME_ENROLLMENT_TOKEN:-dev-runtime-enrollment-token}
      RUNTIME_CREDENTIAL_FILE: ${RUNTIME_CREDENTIAL_FILE:-/var/lib/agent-hub-runtime/runtime-credential.json}
      RUNTIME_WORK_ROOT: ${RUNTIME_WORK_ROOT:-/var/lib/agent-hub-runtime}
      RUNTIME_SESSION_IDLE_TIMEOUT_SECS: ${RUNTIME_SESSION_IDLE_TIMEOUT_SECS:-900}
      RUNTIME_MAX_ONLINE_SESSIONS: ${RUNTIME_MAX_ONLINE_SESSIONS:-4}
      RUNTIME_HOSTNAME: ${RUNTIME_HOSTNAME:-compose-runtime-1}
      RUNTIME_CODEX_DRIVER: ${RUNTIME_CODEX_DRIVER:-app-server}
      RUNTIME_HEALTH_BIND_ADDR: ${RUNTIME_HEALTH_BIND_ADDR:-0.0.0.0:8081}
      CODEX_BIN: ${CODEX_BIN:-/usr/local/bin/fake-codex}
      RUST_LOG: ${RUNTIME_RUST_LOG:-agent_hub_runtime=info}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://$${RUNTIME_HEALTH_BIND_ADDR:-0.0.0.0:8081}/healthz\""]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - runtime-data:/var/lib/agent-hub-runtime
    depends_on:
      backend:
        condition: service_healthy
      fake-model-provider:
        condition: service_started
      runtime-init:
        condition: service_completed_successfully

  fake-model-provider:
    image: python:3.12-slim
    labels: *development-labels
    user: "65532:65532"
    environment:
      FAKE_MODEL_PROVIDER_API_KEY: ${FAKE_MODEL_PROVIDER_API_KEY:-dev-model-provider-api-key}
    command: ["python", "/app/fake-model-provider.py"]
    volumes:
      - ./deploy/fake-model-provider.py:/app/fake-model-provider.py:ro

  frontend:
    labels: *development-labels
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - "${FRONTEND_PORT:-15173}:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
  hub-data:
  runtime-data:
  bundle-store-data:
