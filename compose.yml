name: agent-hub

x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-agent_hub}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - hub-network
    logging: *service-logging

  bundle-store:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${HUB_BUNDLE_S3_ACCESS_KEY_ID:?Set HUB_BUNDLE_S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${HUB_BUNDLE_S3_SECRET_ACCESS_KEY:?Set HUB_BUNDLE_S3_SECRET_ACCESS_KEY in .env}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - bundle-store-data:/data
    networks:
      - hub-network
    logging: *service-logging

  bundle-store-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://bundle-store:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${HUB_BUNDLE_S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${HUB_BUNDLE_S3_ACCESS_KEY_ID:?Set HUB_BUNDLE_S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${HUB_BUNDLE_S3_SECRET_ACCESS_KEY:?Set HUB_BUNDLE_S3_SECRET_ACCESS_KEY in .env}
      HUB_BUNDLE_S3_BUCKET: ${HUB_BUNDLE_S3_BUCKET:-agent-hub-sessions}
    depends_on:
      bundle-store:
        condition: service_healthy
    networks:
      - hub-network
    logging: *service-logging

  model-gateway:
    image: ${AGENT_HUB_IMAGE_REGISTRY:-ghcr.io/yiiilin}/agent-hub-gateway:${AGENT_HUB_IMAGE_TAG:-0.3.1}
    restart: unless-stopped
    environment:
      MODEL_GATEWAY_AUTH_TOKEN: ${HUB_MODEL_GATEWAY_AUTH_TOKEN:?Set HUB_MODEL_GATEWAY_AUTH_TOKEN in .env}
      MODEL_GATEWAY_LISTEN_ADDR: 0.0.0.0:8090
      MODEL_GATEWAY_UPSTREAM_TIMEOUT: ${MODEL_GATEWAY_UPSTREAM_TIMEOUT:-60s}
      MODEL_GATEWAY_STREAM_IDLE_TIMEOUT: ${MODEL_GATEWAY_STREAM_IDLE_TIMEOUT:-120s}
    networks:
      - model-network
    logging: *service-logging

  backend:
    image: ${AGENT_HUB_IMAGE_REGISTRY:-ghcr.io/yiiilin}/agent-hub:${AGENT_HUB_IMAGE_TAG:-0.3.1}
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      BIND_ADDR: 0.0.0.0:8080
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      EMBED_JWT_SECRET: ${EMBED_JWT_SECRET:?Set EMBED_JWT_SECRET in .env}
      EMBED_JWT_ISSUER: ${EMBED_JWT_ISSUER:-agent-hub}
      EMBED_JWT_AUDIENCE: ${EMBED_JWT_AUDIENCE:-agent-hub-widget}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      SEED_DEV_USER: "false"
      SEED_DEV_MODEL_CONNECTION: "false"
      HUB_MODEL_SECRET_KEY: ${HUB_MODEL_SECRET_KEY:?Set HUB_MODEL_SECRET_KEY in .env}
      HUB_MODEL_PROXY_TIMEOUT_SECS: ${HUB_MODEL_PROXY_TIMEOUT_SECS:-300}
      HUB_MODEL_GATEWAY_URL: http://model-gateway:8090
      HUB_MODEL_GATEWAY_AUTH_TOKEN: ${HUB_MODEL_GATEWAY_AUTH_TOKEN:?Set HUB_MODEL_GATEWAY_AUTH_TOKEN in .env}
      HUB_SESSION_BUNDLE_MAX_BYTES: ${HUB_SESSION_BUNDLE_MAX_BYTES:-10737418240}
      HUB_BUNDLE_S3_ENDPOINT: ${HUB_BUNDLE_S3_ENDPOINT:-http://bundle-store:9000}
      HUB_BUNDLE_S3_BUCKET: ${HUB_BUNDLE_S3_BUCKET:-agent-hub-sessions}
      HUB_BUNDLE_S3_REGION: ${HUB_BUNDLE_S3_REGION:-us-east-1}
      HUB_BUNDLE_S3_ACCESS_KEY_ID: ${HUB_BUNDLE_S3_ACCESS_KEY_ID:?Set HUB_BUNDLE_S3_ACCESS_KEY_ID in .env}
      HUB_BUNDLE_S3_SECRET_ACCESS_KEY: ${HUB_BUNDLE_S3_SECRET_ACCESS_KEY:?Set HUB_BUNDLE_S3_SECRET_ACCESS_KEY in .env}
      HUB_BUNDLE_S3_SESSION_TOKEN: ${HUB_BUNDLE_S3_SESSION_TOKEN:-}
      HUB_BUNDLE_S3_SERVER_SIDE_ENCRYPTION: ${HUB_BUNDLE_S3_SERVER_SIDE_ENCRYPTION:-}
      HUB_BUNDLE_S3_KMS_KEY_ID: ${HUB_BUNDLE_S3_KMS_KEY_ID:-}
      HUB_BUNDLE_S3_ALLOW_HTTP: ${HUB_BUNDLE_S3_ALLOW_HTTP:-true}
      HUB_SKILL_PACKAGE_STORAGE: ${HUB_SKILL_PACKAGE_STORAGE:-s3}
      HUB_SKILL_PACKAGE_LOCAL_DIR: ${HUB_SKILL_PACKAGE_LOCAL_DIR:-/var/lib/agent-hub/skill-packages}
      RUST_LOG: ${BACKEND_RUST_LOG:-agent_hub_backend=info,tower_http=info}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      bundle-store-init:
        condition: service_completed_successfully
      model-gateway:
        condition: service_healthy
    volumes:
      - hub-data:/var/lib/agent-hub
    networks:
      - hub-network
      - model-network
    logging: *service-logging

  runtime-init:
    profiles: ["runtime"]
    image: ${AGENT_HUB_IMAGE_REGISTRY:-ghcr.io/yiiilin}/agent-hub-runtime:${AGENT_HUB_IMAGE_TAG:-0.3.1}
    user: "0:0"
    command: ["chown", "-R", "10001:10001", "/var/lib/agent-hub-runtime"]
    volumes:
      - runtime-data:/var/lib/agent-hub-runtime
    networks:
      - hub-network

  runtime:
    profiles: ["runtime"]
    image: ${AGENT_HUB_IMAGE_REGISTRY:-ghcr.io/yiiilin}/agent-hub-runtime:${AGENT_HUB_IMAGE_TAG:-0.3.1}
    restart: unless-stopped
    environment:
      HUB_URL: http://backend:8080
      RUNTIME_ENROLLMENT_TOKEN: ${RUNTIME_ENROLLMENT_TOKEN:-}
      RUNTIME_CREDENTIAL_FILE: /var/lib/agent-hub-runtime/runtime-credential.json
      RUNTIME_WORK_ROOT: /var/lib/agent-hub-runtime
      RUNTIME_ENGINE_TIMEOUT_SECS: ${RUNTIME_ENGINE_TIMEOUT_SECS:-3600}
      RUNTIME_SESSION_IDLE_TIMEOUT_SECS: ${RUNTIME_SESSION_IDLE_TIMEOUT_SECS:-900}
      RUNTIME_MAX_ONLINE_SESSIONS: ${RUNTIME_MAX_ONLINE_SESSIONS:-4}
      RUNTIME_HOSTNAME: ${RUNTIME_HOSTNAME:-compose-runtime-1}
      RUNTIME_ENGINE_DRIVER: pi
      ENGINE_BIN: /opt/agent-hub/pi/pi
      RUNTIME_ENGINE_VERSION: 0.81.1
      RUNTIME_HEALTH_BIND_ADDR: 0.0.0.0:8081
      RUST_LOG: ${RUNTIME_RUST_LOG:-agent_hub_runtime=info}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
    volumes:
      - runtime-data:/var/lib/agent-hub-runtime
    depends_on:
      backend:
        condition: service_healthy
      runtime-init:
        condition: service_completed_successfully
    networks:
      - hub-network
    logging: *service-logging

networks:
  hub-network:
  model-network:

volumes:
  postgres-data:
  hub-data:
  runtime-data:
  bundle-store-data:
